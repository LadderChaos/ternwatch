<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notch Companion – Icon Concept A Refined</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a1a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 40px; }
  h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
  p.sub { color: #888; font-size: 14px; margin-bottom: 40px; }
  .row { display: flex; gap: 32px; align-items: end; flex-wrap: wrap; }
  .card { text-align: center; }
  .card span { font-size: 12px; color: #555; display: block; margin-top: 8px; }
  .macos-icon { border-radius: 56px; overflow: hidden; }
</style>
</head>
<body>
<h1>Notch Companion – Concept A Refined</h1>
<p class="sub">Notch at top, larger pulse rings centered below</p>

<div class="row">
  <div class="card">
    <svg width="512" height="512" viewBox="0 0 256 256" class="macos-icon">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1c1c1e"/>
          <stop offset="100%" stop-color="#0a0a0a"/>
        </linearGradient>
        <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f59e0b"/>
          <stop offset="100%" stop-color="#ef4444"/>
        </linearGradient>
      </defs>
      <rect width="256" height="256" rx="56" fill="url(#bg)"/>

      <!-- Notch at top -->
      <path d="M88 0 Q88 28 108 28 L148 28 Q168 28 168 0" fill="#000" stroke="#222" stroke-width="1.5"/>

      <!-- Pulse rings - centered in icon -->
      <circle cx="128" cy="128" r="24" fill="none" stroke="url(#glow)" stroke-width="2.5" opacity="0.5"/>
      <circle cx="128" cy="128" r="44" fill="none" stroke="url(#glow)" stroke-width="2" opacity="0.35"/>
      <circle cx="128" cy="128" r="64" fill="none" stroke="url(#glow)" stroke-width="1.5" opacity="0.2"/>
      <circle cx="128" cy="128" r="84" fill="none" stroke="url(#glow)" stroke-width="1" opacity="0.1"/>
    </svg>
    <span>512px</span>
  </div>

  <div class="card">
    <svg width="256" height="256" viewBox="0 0 256 256" class="macos-icon">
      <rect width="256" height="256" rx="56" fill="url(#bg)"/>
      <path d="M88 0 Q88 28 108 28 L148 28 Q168 28 168 0" fill="#000" stroke="#222" stroke-width="1.5"/>
      <circle cx="128" cy="128" r="24" fill="none" stroke="url(#glow)" stroke-width="2.5" opacity="0.5"/>
      <circle cx="128" cy="128" r="44" fill="none" stroke="url(#glow)" stroke-width="2" opacity="0.35"/>
      <circle cx="128" cy="128" r="64" fill="none" stroke="url(#glow)" stroke-width="1.5" opacity="0.2"/>
      <circle cx="128" cy="128" r="84" fill="none" stroke="url(#glow)" stroke-width="1" opacity="0.1"/>
    </svg>
    <span>256px</span>
  </div>

  <div class="card">
    <svg width="128" height="128" viewBox="0 0 256 256" style="border-radius:28px;">
      <rect width="256" height="256" rx="56" fill="url(#bg)"/>
      <path d="M88 0 Q88 28 108 28 L148 28 Q168 28 168 0" fill="#000" stroke="#222" stroke-width="2"/>
      <circle cx="128" cy="128" r="24" fill="none" stroke="url(#glow)" stroke-width="3" opacity="0.5"/>
      <circle cx="128" cy="128" r="44" fill="none" stroke="url(#glow)" stroke-width="2.5" opacity="0.35"/>
      <circle cx="128" cy="128" r="64" fill="none" stroke="url(#glow)" stroke-width="2" opacity="0.2"/>
      <circle cx="128" cy="128" r="84" fill="none" stroke="url(#glow)" stroke-width="1.5" opacity="0.1"/>
    </svg>
    <span>128px</span>
  </div>

  <div class="card">
    <svg width="64" height="64" viewBox="0 0 256 256" style="border-radius:14px;">
      <rect width="256" height="256" rx="56" fill="url(#bg)"/>
      <path d="M88 0 Q88 28 108 28 L148 28 Q168 28 168 0" fill="#000" stroke="#222" stroke-width="3"/>
      <circle cx="128" cy="128" r="24" fill="none" stroke="url(#glow)" stroke-width="5" opacity="0.5"/>
      <circle cx="128" cy="128" r="44" fill="none" stroke="url(#glow)" stroke-width="4" opacity="0.35"/>
      <circle cx="128" cy="128" r="64" fill="none" stroke="url(#glow)" stroke-width="3" opacity="0.2"/>
      <circle cx="128" cy="128" r="84" fill="none" stroke="url(#glow)" stroke-width="2" opacity="0.1"/>
    </svg>
    <span>64px</span>
  </div>

  <div class="card">
    <svg width="32" height="32" viewBox="0 0 256 256" style="border-radius:8px;">
      <rect width="256" height="256" rx="56" fill="url(#bg)"/>
      <path d="M88 0 Q88 28 108 28 L148 28 Q168 28 168 0" fill="#000" stroke="#222" stroke-width="5"/>
      <circle cx="128" cy="128" r="24" fill="none" stroke="url(#glow)" stroke-width="8" opacity="0.5"/>
      <circle cx="128" cy="128" r="44" fill="none" stroke="url(#glow)" stroke-width="6" opacity="0.35"/>
      <circle cx="128" cy="128" r="64" fill="none" stroke="url(#glow)" stroke-width="4" opacity="0.2"/>
      <circle cx="128" cy="128" r="84" fill="none" stroke="url(#glow)" stroke-width="3" opacity="0.1"/>
    </svg>
    <span>32px</span>
  </div>
</div>

</body>
</html>
