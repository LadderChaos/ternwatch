[package]
name = "ternwatch"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
notify = "8.2.1"
# `Paragraph::line_count`, to scroll the wrapped inspector exactly.
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.3"

[target.'cfg(target_os = "macos")'.dependencies]
# FSEvents discovers directories; kqueue reports writes to open transcript files.
kqueue = "1.2.1"
